# SOU Codex OS - configuração local

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

persistent_instructions = "Siga AGENTS.md. Para qualquer assunto sobre Fabio, SOU ou negócios, consulte knowledge/ antes de responder."

[features]
multi_agent = true

[profiles.research]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "live"

[profiles.safe-write]
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
max_concurrent_threads_per_session = 4
interrupt_message = true

[agents.explorer]
description = "Explora arquivos e resume evidências sem alterar nada."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Revisa entregas com foco em clareza, risco, segurança e lacunas."
